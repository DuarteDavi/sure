<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surebet Radar - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        backBlue: '#dbeafe',
                        backBlueText: '#1e3a8a',
                        darkBg: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-200 font-sans min-h-screen selection:bg-emerald-500 selection:text-white">
    <div id="app" class="max-w-7xl mx-auto p-4 md:p-8">
        
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
                    <i class="fa-solid fa-bolt mr-2"></i>BetBra Radar
                </h1>
                <p class="text-slate-400 text-sm mt-1">Scanner de Arbitragem em Tempo Real via Socket</p>
            </div>
            
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                <input 
                    v-model="searchQuery" 
                    type="text" 
                    placeholder="Filtrar eventos ou casas..." 
                    class="w-full bg-slate-800 text-white rounded-lg pl-10 pr-4 py-2 border border-slate-700 focus:border-emerald-500 focus:outline-none"
                >
            </div>
        </header>

        <div class="flex justify-between items-center mb-6">
            <div class="flex space-x-1 bg-slate-800 p-1 rounded-lg w-fit">
                <button class="px-4 py-2 rounded-md font-medium text-sm transition-all bg-emerald-600 text-white shadow-lg flex items-center">
                    <span class="w-2 h-2 rounded-full bg-white mr-2" :class="{ 'animate-ping': conectando }"></span> {{ statusConexao }}
                </button>
            </div>
            <div class="text-sm text-slate-400 font-medium">
                {{ filteredSurebets.length }} Oportunidades Encontradas
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
            <div v-for="sb in filteredSurebets" :key="sb.id" class="bg-cardBg rounded-xl border border-slate-700 hover:border-emerald-500/50 transition-colors shadow-lg overflow-hidden flex flex-col transform hover:-translate-y-1 duration-200">
                
                <div class="bg-slate-800/80 border-b border-slate-700 px-5 py-3 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <span class="bg-emerald-500/20 text-emerald-400 font-extrabold px-3 py-1.5 rounded-md text-sm border border-emerald-500/30">
                            <i class="fa-solid fa-sack-dollar mr-1.5"></i> ROI {{ sb.roi }}%
                        </span>
                        <span class="text-slate-400 text-xs font-medium">
                            <i class="fa-regular fa-clock mr-1"></i> {{ sb.age }}
                        </span>
                    </div>
                </div>

                <div class="p-5 flex-1 flex flex-col gap-4">
                    <div v-for="(leg, index) in sb.legs" :key="index" class="relative">
                        <div v-if="index !== sb.legs.length - 1" class="absolute left-[13px] top-8 bottom-[-24px] w-0.5 bg-slate-700"></div>

                        <div class="flex items-start gap-3 relative z-10">
                            <div class="w-7 h-7 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-xs font-bold text-slate-300 shrink-0">
                                {{ index + 1 }}
                            </div>
                            
                            <div class="flex-1 bg-slate-800/40 rounded-lg p-3 border border-slate-700/50 flex justify-between items-center">
                                <div class="pr-2 overflow-hidden">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="font-bold text-cyan-300 text-sm truncate">{{ leg.bookmaker }}</span>
                                    </div>
                                    <div class="text-sm font-medium text-slate-200 mb-1 truncate">{{ leg.event }}</div>
                                    <div class="text-xs text-slate-400 truncate">{{ leg.market }}</div>
                                </div>
                                <div class="bg-backBlue text-backBlueText font-extrabold px-3 py-2 rounded text-center">
                                    {{ leg.odd }}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    searchQuery: '',
                    statusConexao: 'Conectando ao Motor...',
                    conectando: true,
                    surebets: []
                }
            },
            computed: {
                filteredSurebets() {
                    if (!this.searchQuery) return this.surebets;
                    const q = this.searchQuery.toLowerCase();
                    return this.surebets.filter(sb => {
                        return sb.legs.some(leg => 
                            leg.bookmaker.toLowerCase().includes(q) || 
                            leg.event.toLowerCase().includes(q)
                        );
                    });
                }
            },
            mounted() {
                // Conecta no Socket.IO do Flask na porta 8001
                const socket = io();

                socket.on('connect', () => {
                    this.statusConexao = 'Scanner Online (Escutando)';
                    this.conectando = false;
                });

                socket.on('disconnect', () => {
                    this.statusConexao = 'Desconectado! Tentando voltar...';
                    this.conectando = true;
                });

                // Escuta o nosso motor da BetBra!
                socket.on('nova_surebet_front', (novaAposta) => {
                    // Joga a nova aposta pro topo da lista
                    this.surebets.unshift(novaAposta);
                    
                    // Remove as velhas se passar de 50 para não pesar o navegador
                    if(this.surebets.length > 50) {
                        this.surebets.pop();
                    }
                });
            }
        }).mount('#app')
    </script>
</body>
</html>
